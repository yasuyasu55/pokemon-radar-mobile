name: Update Otakara and publish
on:
  workflow_dispatch:
  schedule:
    # 22:17 UTC = 翌日07:17 JST。GitHubの混雑で遅延する場合があります。
    - cron: '17 22 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-otakara.yml'
      - 'tools/otakara-dryrun/**'
      - 'tools/mobile/**'
      - 'tests/deadline.test.mjs'
      - 'tests/update-snapshot.test.mjs'
      - 'tests/fixtures/**'

permissions:
  contents: read
concurrency:
  group: otakara-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test adoption and previous data retention
        run: node --test tests/*.test.mjs
      - name: Fetch twice with independent processes
        id: fetch
        run: node tools/otakara-dryrun/cli.mjs all --base "$RUNNER_TEMP/otakara" --gap-seconds 20 --no-bodies
      - name: Record fetch outcome
        if: always()
        run: |
          node tools/mobile/run-summary.mjs "$RUNNER_TEMP/otakara" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate and merge snapshot
        id: adopt
        run: |
          RESULT_DIR=$(find "$RUNNER_TEMP/otakara" -mindepth 1 -maxdepth 1 -type d -name 'otakara-*' | head -n 1)
          node tools/mobile/update-snapshot.mjs "$RESULT_DIR" data/snapshot.json "$RUNNER_TEMP/otakara-update.json"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); console.log("changed="+r.changed);' "$RUNNER_TEMP/otakara-update.json" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/otakara-update.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only the validated snapshot
        if: steps.adopt.outputs.changed == 'true'
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          if git diff --cached --quiet; then echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m 'Update validated Otakara snapshot'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
      - name: Confirm Pages deployment and public snapshot
        if: steps.adopt.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.commit.outputs.sha }}
        run: node tools/mobile/wait-publication.mjs "$PUBLISHED_SHA" data/snapshot.json | tee -a "$GITHUB_STEP_SUMMARY"

