name: Update Otakara and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-otakara.yml'
      - 'tools/**'
      - 'tests/update-snapshot.test.mjs'

permissions:
  contents: read
concurrency:
  group: otakara-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test adoption and previous data retention
        run: node --test tests/update-snapshot.test.mjs
      - name: Fetch twice with independent processes
        id: fetch
        run: node tools/otakara-dryrun/cli.mjs all --base "$RUNNER_TEMP/otakara" --gap-seconds 20 --no-bodies
      - name: Record fetch outcome
        if: always()
        run: |
          node tools/mobile/run-summary.mjs "$RUNNER_TEMP/otakara" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate and merge snapshot
        run: |
          RESULT_DIR=$(find "$RUNNER_TEMP/otakara" -mindepth 1 -maxdepth 1 -type d -name 'otakara-*' | head -n 1)
          node tools/mobile/update-snapshot.mjs "$RESULT_DIR" data/snapshot.json
      - name: Commit only the validated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update validated Otakara snapshot'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
      - name: Stage public viewer only
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html style.css app.mjs model.mjs install.mjs manifest.webmanifest .nojekyll "$RUNNER_TEMP/site/"
          cp -r data icons "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated viewer
        id: deployment
        uses: actions/deploy-pages@v4
