name: Diagnose three Amazon page responses (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/amazon-offer-check/**', '.github/workflows/amazon-offer-check.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify diagnostic rules
        run: node --test tests/amazon-page-health.test.mjs
      - name: Diagnose page health without clicking or publishing
        run: node tools/amazon-offer-check/diagnose.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-amazon-page-health
          path: amazon-page-health.json
          retention-days: 7
