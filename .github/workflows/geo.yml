name: Verify GEO lotteries and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '25 22 * * *'
  push:
    branches: [main]
    paths: ['tools/geo/**', '.github/workflows/geo.yml']
permissions:
  contents: read
concurrency:
  group: otakara-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collector preflight tests
        run: node --test tests/amazon-personal.test.mjs tests/amazon-watch.test.mjs tests/amazon.test.mjs tests/cardlabo.test.mjs tests/deadline.test.mjs tests/personal.test.mjs tests/update-snapshot.test.mjs
      - name: Independent live fetch twice
        run: node tools/geo/collect.mjs all "$RUNNER_TEMP/geo"
      - name: Save structured evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-evidence
          path: ${{ runner.temp }}/geo/*.json
          retention-days: 7
      - name: Adopt only matching validated results
        run: node tools/geo/collect.mjs adopt "$RUNNER_TEMP/geo" data/snapshot.json
      - name: Commit validated snapshot
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          if git diff --cached --quiet; then echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m 'Add verified GEO lotteries'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
      - name: Confirm public data
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.commit.outputs.sha }}
        run: node tools/mobile/wait-publication.mjs "$PUBLISHED_SHA" data/snapshot.json
