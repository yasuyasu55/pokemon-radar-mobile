name: Collect X candidates and verify Amazon invitations
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/x-social-discovery/**'
      - 'tools/amazon-browser-probe/**'
      - 'tests/x-collection.test.mjs'
      - 'tests/amazon-live-update.test.mjs'
      - '.github/workflows/x-amazon-live.yml'
permissions:
  contents: write
concurrency:
  group: otakara-publish
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate and publication rules
        run: node --test tests/*.test.mjs
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Acquire X posts and persist candidate inputs
        id: x
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node tools/x-social-discovery/collect-posts.mjs data/internal
      - name: Verify Amazon product details independently twice
        id: amazon
        continue-on-error: true
        run: node tools/amazon-browser-probe/update-live.mjs all "$RUNNER_TEMP/amazon-live" data/snapshot.json data/internal/amazon-asin-pool.json
      - name: Preserve structured acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-amazon-live-evidence
          path: |
            data/internal/x-collection-status.json
            ${{ runner.temp }}/amazon-live/**/result.json
            ${{ runner.temp }}/amazon-live/status.json
          retention-days: 7
      - name: Commit status, candidate pool and verified publication changes
        if: always() && steps.x.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/internal/x-collection-state.json data/internal/x-collection-status.json data/internal/x-candidates.json data/internal/amazon-asin-pool.json data/snapshot.json; do
            if test -f "$f"; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update X acquisition status and verified Amazon invitations'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Acquisition summary
        if: always()
        run: |
          if test -f data/internal/x-collection-status.json; then
            echo '### X acquisition (candidates only)' >> "$GITHUB_STEP_SUMMARY"
            cat data/internal/x-collection-status.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/amazon-live/status.json"; then
            echo '### Amazon independent detail verification' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/amazon-live/status.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mark incomplete acquisition explicitly
        if: steps.x.outcome == 'failure' || steps.amazon.outcome == 'failure'
        run: |
          echo 'Acquisition is incomplete. Retained data is not evidence of successful monitoring.'
          exit 10
