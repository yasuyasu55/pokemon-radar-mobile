name: Check PC daily setup and X readiness handling
on:
  push:
    branches: [main]
    paths: ['tools/pc-collector/**', 'tools/x-social-discovery/read-visible.mjs', 'tools/x-social-discovery/collect-browser.mjs', 'tests/x-read-visible.test.mjs', '*DAILY-PC-COLLECTION.cmd', '.github/workflows/pc-daily-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/x-read-visible.test.mjs tests/x-browser-candidates.test.mjs
      - name: Parse scripts with Windows PowerShell 5.1 (no registration)
        shell: powershell
        run: |
          foreach ($file in @('tools/pc-collector/install-daily.ps1','tools/pc-collector/daily-run.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          }
