name: Build hidden Amazon watch inputs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'data/snapshot.json'
      - 'data/internal/amazon-asin-pool.json'
      - 'tools/amazon-watch/**'
      - 'tests/amazon-watch.test.mjs'
      - '.github/workflows/amazon-watch-inputs.yml'

permissions:
  contents: write

concurrency:
  group: amazon-watch-inputs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test hidden Amazon watch logic
        run: node --test tests/amazon-watch.test.mjs
      - name: Build discovery seeds and CRAWL STORM X handoff
        run: node tools/amazon-watch/build-seeds.mjs data/snapshot.json data/internal/amazon-search-seeds.json data/internal/amazon-asin-pool.json data/internal/crawl-storm-x-targets.json
      - name: Commit internal watch inputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/internal/amazon-search-seeds.json data/internal/crawl-storm-x-targets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh hidden Amazon watch inputs'
          git push origin HEAD:main
