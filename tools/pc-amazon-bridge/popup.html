<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>POKEMON RADAR</title><link rel="stylesheet" href="popup.css"></head><body><div class="container">
<h1>POKEMON RADAR</h1>
<p class="description">Amazonの商品欄で招待リクエストを確認し、PC・スマホで共有します。PC版アプリの起動は不要です。</p>
<button id="amazonBridgeButton" type="button">Amazon案件をスマホと共有</button><p id="amazonBridgeStatus" class="status" role="status"></p><hr>
<p class="description">現在開いている抽選・予約ページをPC版へ取り込みます。</p>
<button id="captureButton" type="button">このページを取り込む</button><p id="statusMessage" class="status" role="status"></p><hr>
<p class="description">X・LINE・アプリ・店頭QR等、自動巡回できないページをそのまま候補登録します。</p>
<button id="manualIntakeButton" type="button" class="secondary">現在のページを半自動取込</button><p id="manualIntakeStatusMessage" class="status" role="status"></p><hr>
<p class="description">全HP一括確認の初期設定（初回のみ）。</p>
<button id="setupBatchButton" type="button" class="secondary">一括確認の初期設定</button><p id="setupStatusMessage" class="status" role="status"></p>
</div><script src="popup.js"></script><script src="amazonBridgePopup.js"></script></body></html>
